<!doctype html>
<html lang="id" class="scroll-smooth">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="/js/database.js"></script>
    <script src="js/utils.js"></script>
    <script src="/js/register.js"></script>
    <script src="js/userNavbar.js"></script>
</head>

<body class="bg-gray-100 text-gray-800 font-sans antialiased min-h-screen flex flex-col">
    <header class="bg-white shadow-sm sticky top-0 z-50 flex flex-row p-4 ">
        <div class="flex items-center">
            <a href="index.html" class="text-xl font-bold">TokoKita</a>
        </div>
        <nav class="ml-auto">
            <ul class="flex flex-row gap-4 list-none" id="nav">
                <li class="flex items-center">
                    <a href="index.html#home">Home</a>
                </li>
                <li class="flex items-center">
                    <a href="index.html#produk">Produk</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="flex items-center  justify-center my-auto">
        <div class="flex flex-col bg-white m-auto p-12 gap-4 max-w-md">
            <h2 class="text-2xl font-bold text-center">Create your account</h2>
            <form id="register" action="" class="flex flex-col mt-6 w-full">
                <input class="mb-4 border border-gray-200 rounded-md py-2 px-3" placeholder="Name" type="text"
                    name="name" id="name">
                <input class="mb-4 border border-gray-200 rounded-md py-2 px-3" placeholder="Email address" type="email"
                    name="email" id="email">
                <input class="mb-4 border border-gray-200 rounded-md py-2 px-3" placeholder="Password" type="password"
                    name="password">
                <input class="mb-4 border border-gray-200 rounded-md py-2 px-3" placeholder="Confirm password"
                    type="password" name="password-confirm">
                <div class="flex flex-row gap-2 items-center">
                    <input type="checkbox" name="agreement" id="agreement"
                        class="cursor-pointer h-4 w-4 rounded border-gray-300">
                    <label for="agreement" class="cursor-pointer text-sm">I agree to the <a href="#"
                            class="text-blue-500">Terms of
                            Service</a> and <a href="#" class="text-blue-500">Privacy Policy</a></label>
                </div>
                <button type="submit"
                    class="bg-sky-400 py-2 mt-8 rounded-sm cursor-pointer  hover:bg-sky-600  transition-colors duration-100">Sign
                    Up</button>
                <p id="error" class="text-center text-sm mt-2 hidden text-red-500"></p>
            </form>
            <p class="text-sm">Already have an account? <a class="text-blue-500" href="login.html">Sign in.</a></p>
        </div>
    </main>

    <footer class="flex justify-center items-center flex-col min-h-32 bg-slate-700 text-white">
        <p class="text-lg font-bold">TokoKita</p>
        <p>Nomor WhatsApp: +62 857 1234 5678</p>
        <p>Copyright (c) 2026 TokoKita</p>
    </footer>
</body>

</html>
